name: pr-a2

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  build:
    name: Build PR evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR merge as untrusted input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test with JUnit evidence
        run: |
          mkdir -p evidence
          node --test --test-reporter=junit --test-reporter-destination=evidence/ci-junit.xml

      - name: Upload untrusted test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-junit-${{ github.event.pull_request.number }}
          path: evidence/ci-junit.xml
          if-no-files-found: error
          retention-days: 30

  trusted-tests:
    name: Trusted base tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR source
        run: |
          git fetch --no-tags origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pull/head"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install trusted test dependencies
        run: pnpm install --frozen-lockfile

      - name: Replace source with PR data (base tests remain trusted)
        run: git checkout refs/remotes/pull/head -- src

      - name: Run trusted base tests
        run: |
          mkdir -p evidence
          node --test --test-reporter=junit --test-reporter-destination=evidence/trusted-junit.xml

      - name: Upload trusted test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-junit-${{ github.event.pull_request.number }}
          path: evidence/trusted-junit.xml
          if-no-files-found: error
          retention-days: 90

  verify:
    name: Trusted A2 verifier
    needs: [build, trusted-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR head as data
        run: |
          git fetch --no-tags origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pull/head"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DIFF_BASE=$(git merge-base HEAD refs/remotes/pull/head)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install trusted verifier
        run: pnpm install --frozen-lockfile

      - name: Download trusted test evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trusted-junit-${{ github.event.pull_request.number }}
          path: evidence

      - name: Put trusted JUnit inside the attested bundle
        run: |
          mkdir -p .firetree/evidence
          cp evidence/trusted-junit.xml .firetree/evidence/ci-junit.xml

      - name: Fetch OIDC JWT
        run: node scripts/github-oidc.mjs --out claims.json --audience firetree

      - name: Assess PR diff with trusted policy
        env:
          HEAD: refs/remotes/pull/head
          PR: ${{ github.event.pull_request.number }}
        run: |
          node bin/firetree-assess.mjs \
            --base "$DIFF_BASE" \
            --head "$HEAD" \
            --change "pr-$PR"

      - name: Build autonomous technical evidence
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          node bin/firetree-ci.mjs \
            --change "pr-$PR" \
            --evidence .firetree/evidence/ci-junit.xml \
            --intent-spec "PR #$PR"

      - name: Verify dossier binding
        env:
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/check-dossier.mjs --change "pr-$PR"

      - name: Build attested evidence bundle
        run: |
          node --input-type=module -e '
            import { writeFile } from "node:fs/promises";
            import { buildBundleManifest } from "./src/lib/bundle.js";
            const manifest = await buildBundleManifest(".firetree");
            await writeFile(".firetree/bundle-manifest.json", `${JSON.stringify(manifest, null, 2)}\n`, "utf8");
          '


      - name: Verify A2
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          FIRE_TREE_ALLOW_PUBLIC_REVIEW_PROVIDER: ${{ github.event.repository.private == false }}
        run: |
          REQUIRE=A2
          node bin/firetree-check.mjs \
            --mode autonomous \
            --change "pr-$PR" \
            --jwt claims.json.jwt \
            --claims-sha "$BASE_SHA" \
            --workflow-ref "$WORKFLOW_REF" \
            --repository "${{ github.repository }}" \
            --audience firetree \
            --bundle .firetree \
            --event-anchor .firetree/evidence/pr-$PR.event-anchor.json \
            --require "$REQUIRE"

      - name: Upload retained FireTree artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firetree-a2-${{ github.event.pull_request.number }}
          path: .firetree/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  report:
    name: Publish PR check
    needs: [build, verify]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Publish check on PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            conclusion=success
          else
            conclusion=failure
          fi
          gh api --method POST "repos/${{ github.repository }}/check-runs" \
            -f name=firetree-a2 \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=FireTree A2" \
            -f "output[summary]=verifier result: $RESULT"

