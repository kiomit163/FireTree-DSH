name: pr-a2

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  build:
    name: Build PR evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR merge as untrusted input
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test with JUnit evidence
        run: |
          mkdir -p evidence
          node --test --test-reporter=junit --test-reporter-destination=evidence/ci-junit.xml

      - name: Upload untrusted test evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr-junit-${{ github.event.pull_request.number }}
          path: evidence/ci-junit.xml
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Trusted A2 verifier
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      actions: read
      attestations: write
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Fetch PR head as data
        run: |
          git fetch --no-tags origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pull/head"
          echo "BASE_SHA=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" refs/remotes/pull/head)" >> "$GITHUB_ENV"
          echo "TRUSTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install trusted verifier
        run: pnpm install --frozen-lockfile

      - name: Download untrusted evidence
        uses: actions/download-artifact@v4
        with:
          name: pr-junit-${{ github.event.pull_request.number }}
          path: evidence

      - name: Fetch OIDC JWT
        run: node scripts/github-oidc.mjs --out claims.json --audience firetree

      - name: Assess PR diff with trusted policy
        env:
          HEAD: refs/remotes/pull/head
          PR: ${{ github.event.pull_request.number }}
        run: |
          node bin/firetree-assess.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD" \
            --change "pr-$PR"

      - name: Build autonomous technical evidence
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          AI_ARGS=()
          if [ -f ".firetree/ai-reviews/pr-$PR.json" ]; then
            AI_ARGS=(--ai-review ".firetree/ai-reviews/pr-$PR.json")
          fi
          node bin/firetree-ci.mjs \
            --change "pr-$PR" \
            --evidence evidence/ci-junit.xml \
            --intent-spec "PR #$PR" \
            "${AI_ARGS[@]}"

      - name: Build attested evidence bundle
        run: |
          node --input-type=module -e '
            import { writeFile } from "node:fs/promises";
            import { buildBundleManifest } from "./src/lib/bundle.js";
            const manifest = await buildBundleManifest(".firetree");
            await writeFile(".firetree/bundle-manifest.json", `${JSON.stringify(manifest, null, 2)}\n`, "utf8");
          '

      - name: Attest evidence bundle
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .firetree/bundle-manifest.json

      - name: Verify A2
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          AI_ARGS=()
          REQUIRE=A2
          if [ -f ".firetree/ai-reviews/pr-$PR.json" ]; then
            AI_ARGS=(--ai-review ".firetree/ai-reviews/pr-$PR.json")
            REQUIRE=A3-AI-S
          fi
          node bin/firetree-check.mjs \
            --mode autonomous \
            --change "pr-$PR" \
            --jwt claims.json.jwt \
            --claims-sha "$TRUSTED_SHA" \
            --workflow-ref "${{ github.workflow_ref }}" \
            --repository "${{ github.repository }}" \
            --audience firetree \
            --bundle .firetree \
            --attestation "${{ steps.attest.outputs.bundle-path }}" \
            --require "$REQUIRE" \
            "${AI_ARGS[@]}"

      - name: Upload retained FireTree artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firetree-a2-${{ github.event.pull_request.number }}
          path: .firetree/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  report:
    name: Publish PR check
    needs: [build, verify]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Publish check on PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            conclusion=success
          else
            conclusion=failure
          fi
          gh api --method POST "repos/${{ github.repository }}/check-runs" \
            -f name=firetree-a2 \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=FireTree A2" \
            -f "output[summary]=verifier result: $RESULT"
