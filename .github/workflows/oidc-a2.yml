name: oidc-a2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  a2-smoke:
    name: OIDC A2 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch OIDC claims
        run: node scripts/github-oidc.mjs --out claims.json --audience firetree

      - name: Run A2 gate
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: node scripts/ci-a2-smoke.mjs --claims claims.json --jwt claims.json.jwt --audience firetree --workflow-ref "$WORKFLOW_REF"

