name: pr-a3-ai

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  trusted-tests:
    name: A3-AI trusted tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR source
        run: |
          git fetch --no-tags origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pull/head"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install trusted test dependencies
        run: pnpm install --frozen-lockfile

      - name: Replace source with PR data (base tests remain trusted)
        run: git checkout refs/remotes/pull/head -- src

      - name: Run trusted base tests
        run: |
          mkdir -p evidence
          node --test --test-reporter=junit --test-reporter-destination=evidence/trusted-junit.xml

      - name: Upload trusted test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a3-trusted-junit-${{ github.event.pull_request.number }}
          path: evidence/trusted-junit.xml
          if-no-files-found: error
          retention-days: 90

  a3-ai:
    name: firetree-a3-ai
    needs: trusted-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR head as data
        run: |
          git fetch --no-tags origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pull/head"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DIFF_BASE=$(git merge-base HEAD refs/remotes/pull/head)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install trusted tools
        run: pnpm install --frozen-lockfile

      - name: Download trusted test evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: a3-trusted-junit-${{ github.event.pull_request.number }}
          path: .firetree/evidence

      - name: Normalize trusted JUnit path
        run: mv .firetree/evidence/trusted-junit.xml .firetree/evidence/ci-junit.xml

      - name: Assess PR with trusted policy and review the exact diff
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD: refs/remotes/pull/head
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          FIRE_TREE_REVIEW_SIGNING_KEY: ${{ secrets.FIRE_TREE_REVIEW_SIGNING_KEY }}
          FIRE_TREE_ALLOW_PUBLIC_REVIEW_PROVIDER: ${{ github.event.repository.private == false }}
        run: |
          node bin/firetree-assess.mjs \
            --base "$DIFF_BASE" \
            --head "$HEAD" \
            --change "pr-$PR"
          mkdir -p .firetree/ai-reviews
          git --no-pager diff --no-ext-diff --no-textconv --no-color "$DIFF_BASE" "$HEAD" > .firetree/evidence/review.diff
          : > .firetree/evidence/review-context.txt
          git diff --name-only "$DIFF_BASE" "$HEAD" | while IFS= read -r file; do
            [ -z "$file" ] && continue
            if git cat-file -e "$HEAD:$file" 2>/dev/null; then
              printf '\n### %s\n' "$file" >> .firetree/evidence/review-context.txt
              git show "$HEAD:$file" | sed -n '1,200p' >> .firetree/evidence/review-context.txt
            fi
          done
          DIFF_SHA=$(node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync(".firetree/changes/pr-"+process.env.PR+"/assessment.json","utf8"));process.stdout.write(a.git.diff_sha256)')
          node scripts/trusted-ai-review.mjs \
            --diff-file .firetree/evidence/review.diff \
            --context-file .firetree/evidence/review-context.txt \
            --change "pr-$PR" \
            --head "$(git rev-parse "$HEAD")" \
            --diff-sha256 "$DIFF_SHA" \
            --out ".firetree/ai-reviews/pr-$PR.json"

      - name: Fetch OIDC JWT
        run: node scripts/github-oidc.mjs --out claims.json --audience firetree

      - name: Build A3-AI evidence
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          node bin/firetree-ci.mjs \
            --root . \
            --change "pr-$PR" \
            --evidence .firetree/evidence/ci-junit.xml \
            --intent-spec "PR #$PR trusted A3-AI review" \
            --assurance A2 \
            --ai-review ".firetree/ai-reviews/pr-$PR.json"

      - name: Verify dossier binding
        env:
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/check-dossier.mjs --change "pr-$PR"

      - name: Verify trust-root binding
        env:
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/check-trust-root.mjs --change "pr-$PR"

      - name: Build attested evidence bundle
        run: |
          node --input-type=module -e '
            import { writeFile } from "node:fs/promises";
            import { buildBundleManifest } from "./src/lib/bundle.js";
            const manifest = await buildBundleManifest(".firetree");
            await writeFile(".firetree/bundle-manifest.json", `${JSON.stringify(manifest, null, 2)}\n`, "utf8");
          '

      - name: Sign A3-AI bundle
        env:
          FIRE_TREE_BUNDLE_SIGNING_KEY: ${{ secrets.FIRE_TREE_BUNDLE_SIGNING_KEY }}
        run: node scripts/sign-bundle.mjs --bundle .firetree --out bundle-signature.json

      - name: Verify A3-AI evidence
        env:
          PR: ${{ github.event.pull_request.number }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          FIRE_TREE_REVIEW_SIGNING_KEY: ${{ secrets.FIRE_TREE_REVIEW_SIGNING_KEY }}
          FIRE_TREE_ALLOW_PUBLIC_REVIEW_PROVIDER: ${{ github.event.repository.private == false }}
        run: |
          node bin/firetree-check.mjs \
            --mode autonomous \
            --root . \
            --change "pr-$PR" \
            --jwt claims.json.jwt \
            --claims-sha "$BASE_SHA" \
            --repository "${{ github.repository }}" \
            --workflow-ref "$WORKFLOW_REF" \
            --audience firetree \
            --bundle .firetree \
            --event-anchor .firetree/evidence/pr-$PR.event-anchor.json \
            --signature bundle-signature.json \
            --public-key trust/bundle-public.pem \
            --ai-review ".firetree/ai-reviews/pr-$PR.json" \
            --review-signing-key-env FIRE_TREE_REVIEW_SIGNING_KEY \
            --require A3-AI

      - name: Upload A3-AI bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a3-ai-${{ github.event.pull_request.number }}
          path: .firetree
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90


