name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: false

      - name: Test
        run: node --test

      - name: Docs
        run: node scripts/check-docs.mjs

      - name: Schemas
        run: node scripts/lint-schemas.mjs

      - name: Syntax
        run: node scripts/check-syntax.mjs
