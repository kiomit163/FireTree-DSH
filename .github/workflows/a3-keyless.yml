name: keyless-a2

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

jobs:
  a3:
    name: Keyless attestation smoke (A2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firetree-a3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test with JUnit evidence
        run: |
          node --test --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/junit.xml"

      - name: Fetch OIDC claims
        run: node scripts/github-oidc.mjs --out claims.json --audience firetree

      - name: Build A3 smoke workspace
        run: |
          node scripts/ci-a3-smoke.mjs \
            --workspace "$RUNNER_TEMP/a3" \
            --claims claims.json \
            --junit "$RUNNER_TEMP/junit.xml"

      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        id: attest
        with:
          subject-path: ${{ runner.temp }}/a3/bundle-manifest.json

      - name: Fetch environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSESSMENT_SHA=$(tr -d '\n' < "$RUNNER_TEMP/a3/.firetree/changes/ci-a3/assessment.json.sha256")
          node scripts/github-environment-approval.mjs \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --environment firetree-a3 \
            --head "${{ github.sha }}" \
            --change ci-a3 \
            --assessment-sha256 "$ASSESSMENT_SHA" \
            --out "$RUNNER_TEMP/approval.json"

      - name: Verify keyless attestation (A2)
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          node bin/firetree-check.mjs \
            --root "$RUNNER_TEMP/a3" \
            --mode autonomous \
            --change ci-a3 \
            --jwt "$GITHUB_WORKSPACE/claims.json.jwt" \
            --workflow-ref "$WORKFLOW_REF" \
            --bundle "$RUNNER_TEMP/a3" \
            --attestation "${{ steps.attest.outputs.bundle-path }}" \
            --approval "$RUNNER_TEMP/approval.json" \
            --signer-workflow "$WORKFLOW_REF" \
            --repository "${{ github.repository }}" \
            --audience firetree \
            --require A2

